# mac-pulse Worker: a push to a branch deploys the preview Worker
# (mac-pulse-preview, `--env preview`); a push to main (a merged PR) deploys
# production (mac-pulse). D1 migrations run before the deploy, so a migration
# must work with the code that is still running.
name: mac-pulse worker

on:
  push:
    paths:
      - mac-pulse/worker/**
      - .github/workflows/mac-pulse-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    # One deploy per environment at a time; a newer push waits instead of racing.
    concurrency:
      group: mac-pulse-${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mac-pulse/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Empty for production (the top-level config).
      ENV_ARGS: ${{ github.ref != 'refs/heads/main' && '--env preview' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mac-pulse/worker/package-lock.json
      - run: npm ci
      - run: npm test
      # ENV_ARGS is split into words on purpose.
      - name: Apply D1 migrations
        run: |
          # shellcheck disable=SC2086
          npx wrangler d1 migrations apply DB --remote $ENV_ARGS
      - name: Deploy
        run: |
          # shellcheck disable=SC2086
          npx wrangler deploy $ENV_ARGS
