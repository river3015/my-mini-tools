# ~/.config/voice-input/config.toml にコピーして使う。

# 録音中に押し続けるキー: cmd_r / alt_r / ctrl_r / shift_r
hotkey = "cmd_r"

# ISO-639-1 の言語コード（Groq は ISO-639-1 のみ受け付ける）
language = "ja"

# 文字起こしに使うサービス。上から順に試し、失敗したら次へ回す。
# API キーがないサービスは飛ばす。クレジット切れのサービスは1時間飛ばす。
# elevenlabs: Scribe（keyterms と no_verbatim が効く）
# groq: Whisper（keyterms は prompt として先頭から約200文字分だけ渡す）
providers = ["elevenlabs", "groq"]

# ElevenLabs のモデル
model = "scribe_v2"

# Groq のモデル: whisper-large-v3 / whisper-large-v3-turbo
groq_model = "whisper-large-v3"

# true にすると「えー」などのフィラーや言い直しを除く（scribe_v2 のみ）
no_verbatim = true

# 認識を寄せたい固有名詞・技術用語。1語50文字未満・5単語以下、< > { } [ ] \ は使えない
keyterms = [
  "Terraform",
  "Terragrunt",
  "GitLab CI",
  "Claude Code",
  "tfstate",
  "AGENTS.md",
]

# 認識結果を機械的に置き換える。上から順に適用する
[replacements]
"クロードコード" = "Claude Code"
