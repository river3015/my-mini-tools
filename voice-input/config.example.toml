# ~/.config/voice-input/config.toml にコピーして使う。

# 録音中に押し続けるキー: cmd_r / alt_r / ctrl_r / shift_r
hotkey = "cmd_r"

# ISO-639-1 または ISO-639-3 の言語コード
language = "ja"

model = "scribe_v2"

# true にすると「えー」などのフィラーや言い直しを除く（scribe_v2 のみ）
no_verbatim = true

# 認識を寄せたい固有名詞・技術用語。1語50文字未満・5単語以下、< > { } [ ] \ は使えない
keyterms = [
  "Terraform",
  "Terragrunt",
  "GitLab CI",
  "Claude Code",
  "tfstate",
  "AGENTS.md",
]

# 認識結果を機械的に置き換える。上から順に適用する
[replacements]
"クロードコード" = "Claude Code"
